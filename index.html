<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumahku, Bagian dan Fungsinya</title>
<meta name="description" content="Game media pembelajaran Pendidikan Pancasila Fase A: bantu Bina mengembalikan warna rumahnya lewat lima misi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Mono:wght@700&display=swap">
<style>
/* Tata letak: panel Bina tetap di kiri (kuning), panggung permainan di kanan (putih).
   Dua tinta saja untuk antarmuka: tinta + kuning. Warna penuh hanya milik gambar, dan itu hadiahnya. */
:root{
  --tinta:#22180F;
  --tinta-2:#4A3A2A;
  --kuning:#F2B705;
  --kuning-tipis:#FFF0BF;
  --kertas:#FFFFFF;
  --langit:#BFE4F4;
  --langit-titik:#9FD2E9;
  --rumput:#4FA86B;
  --rumput-tua:#2F7A4C;
  --garis:4px;
  --bayang:6px 6px 0 var(--tinta);
  --bayang-kecil:4px 4px 0 var(--tinta);
  --huruf:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --angka:"Space Mono",ui-monospace,"Courier New",monospace;
  --mikro:150ms;
  --sedang:280ms;
  --masuk:520ms;
  --panel:clamp(250px,24vw,340px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
@supports (height:100dvh){html{height:100dvh}}
body{margin:0;background:var(--langit);color:var(--tinta);font:500 18px/1.45 var(--huruf);-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:4px dashed var(--tinta);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.duotone{filter:url(#duotone)}

/* ---------- layar pembuka ---------- */
.pembuka{
  position:fixed;inset:0;z-index:60;overflow:hidden;
  background-color:var(--langit);background-image:radial-gradient(circle,var(--langit-titik) 1.7px,transparent 2.1px);background-size:24px 24px;
  padding-top:env(safe-area-inset-top,0px);
}
.pb-isi{
  position:relative;height:100%;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  grid-template-rows:1fr auto auto 1fr clamp(48px,9svh,84px);
  grid-template-areas:"bina ." "bina teks" "bina tombol" "bina ." "tanah tanah";
  column-gap:clamp(16px,4vw,64px);
}
.pb-teks{grid-area:teks;display:flex;flex-direction:column;gap:16px;padding-right:clamp(16px,4vw,56px);min-width:0;position:relative;z-index:2}
.pb-teks .judul-besar{font-size:clamp(38px,5.4vw,108px)}
.pb-teks .logo-baris img{height:clamp(46px,4vw,76px)}
.pb-mapel{font-weight:800;font-size:clamp(18px,1.6vw,30px);background:var(--kertas);border:3px solid var(--tinta);padding:4px 12px;align-self:flex-start}
.pb-tombol{grid-area:tombol;padding:26px clamp(16px,4vw,56px) 0 0;position:relative;z-index:3}
.pembuka .pb-mulai{font-size:clamp(24px,2.3vw,42px);min-height:clamp(76px,8svh,100px);padding:14px clamp(40px,3vw,60px);gap:14px}
.pembuka .pb-mulai svg{width:1.1em;height:1.1em}
.pb-bina{grid-area:bina;position:relative;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:clamp(16px,4svh,48px);z-index:1}
.pb-tokoh{position:relative;height:min(100%,880px);aspect-ratio:329/584}
.pb-tokoh .lambai{height:100%;transform-origin:50% 100%}
/* Animasi Bina sedikit lebih lebar dari kotaknya: ujung jari dan rambut keluar di kiri-kanan.
   Kotaknya tetap 329/584 supaya Bina terbang pas ke panel kiri saat Mulai diketuk. */
.pb-tokoh .lambai .gerak{left:-5.84%;width:111.68%}
.pb-matahari{
  position:absolute;left:50%;top:-5%;width:138%;aspect-ratio:1;transform:translateX(-50%);
  background:var(--kuning);border:var(--garis) solid var(--tinta);border-radius:50%;box-shadow:10px 10px 0 var(--tinta);
}
.pb-sapa{
  position:absolute;z-index:2;left:74%;top:-2%;
  background:var(--kertas);border:var(--garis) solid var(--tinta);border-radius:18px;box-shadow:var(--bayang-kecil);
  padding:8px 14px;font-weight:800;font-size:clamp(18px,1.8vw,26px);line-height:1.15;white-space:nowrap;
}
.pb-sapa::after{content:"";position:absolute;left:18px;bottom:-16px;width:22px;height:16px;background:var(--tinta);clip-path:polygon(0 0,100% 0,0 100%)}
.pb-sapa::before{content:"";position:absolute;left:22px;bottom:-9px;width:14px;height:10px;background:var(--kertas);clip-path:polygon(0 0,100% 0,0 100%);z-index:1}
.pb-tanah{grid-area:tanah;background:var(--rumput);border-top:var(--garis) solid var(--tinta);position:relative;
  background-image:linear-gradient(90deg,var(--rumput-tua) 0 6px,transparent 6px);background-size:46px 100%}
.pb-awan{position:absolute;z-index:0;height:clamp(34px,5svh,52px);background:var(--kertas);border:var(--garis) solid var(--tinta);border-radius:999px;will-change:transform}
.pb-awan::before{content:"";position:absolute;left:22%;bottom:40%;width:42%;height:130%;background:var(--kertas);border:var(--garis) solid var(--tinta);border-bottom:0;border-radius:999px 999px 0 0}
.pb-awan-1{width:clamp(120px,14vw,220px);top:4svh;left:58%;animation:awan 50s linear infinite}
.pb-awan-2{width:clamp(90px,10vw,160px);top:15svh;left:96%;animation:awan 70s linear infinite}
@keyframes awan{from{transform:translateX(0)}to{transform:translateX(-120vw)}}
.pb-masuk .pb-tokoh .lambai{animation:pb-naik .7s cubic-bezier(.2,1.4,.4,1) both}
.pb-masuk .pb-matahari{animation:pb-terbit .6s cubic-bezier(.2,1.3,.4,1) both}
.pb-masuk .pb-sapa{animation:pb-pop .4s cubic-bezier(.2,1.6,.4,1) .55s both}
.pb-masuk .pb-teks,.pb-masuk .pb-tombol{animation:pb-turun .5s ease-out .2s both}
@keyframes pb-naik{from{transform:translateY(60%)}to{transform:none}}
@keyframes pb-terbit{from{transform:translateX(-50%) scale(.3)}to{transform:translateX(-50%) scale(1)}}
@keyframes pb-pop{from{transform:scale(0);transform-origin:0 100%}to{transform:none}}
@keyframes pb-turun{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.pembuka.keluar{pointer-events:none}
.pembuka.keluar > .pb-isi > :not(.pb-bina),.pembuka.keluar .pb-matahari,.pembuka.keluar .pb-sapa,.pembuka.keluar .pb-awan{opacity:0;transition:opacity .3s}
.pembuka.keluar{background-color:transparent;background-image:none;transition:background-color .35s}
.pembuka.geser{transform:translateY(-104%);transition:transform .45s cubic-bezier(.6,0,.4,1)}
.pembuka.pudar{opacity:0;transition:opacity .2s}
@media (max-aspect-ratio:4/5), (max-width:700px){
  .pb-isi{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) clamp(108px,17svh,150px);
    grid-template-areas:"teks" "bina" "tanah";
  }
  .pb-teks{padding:clamp(14px,3svh,28px) 16px 0;gap:10px}
  .pb-teks .judul-besar{font-size:clamp(30px,9.4vw,58px)}
  .pb-teks .logo-baris img{height:38px}
  .pb-mapel{font-size:16px}
  .pb-bina{padding-top:12px}
  .pb-sapa{left:auto;right:-14%;top:1%;font-size:18px}
  .pb-tombol{grid-area:tanah;align-self:center;justify-self:center;padding:0}
  .pb-mulai{min-width:min(78vw,340px)}
  .pb-awan-1{top:14px;left:64%;width:110px;height:34px}
  .pb-awan-2{display:none}
}
@media (max-height:520px) and (min-aspect-ratio:4/5){
  .pb-teks{gap:8px}
  .pb-teks .judul-besar{font-size:clamp(28px,4.4vw,52px)}
  .pb-teks .logo-baris img{height:32px}
  .pb-tombol{padding-top:14px}
  .pb-mulai{min-height:60px;font-size:22px}
}

/* ---------- rangka aplikasi ---------- */
.aplikasi{
  height:100%;display:grid;
  grid-template-columns:var(--panel) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"pemandu panggung" "kendali panggung";
}
.pemandu{
  grid-area:pemandu;background:var(--kuning);border-right:var(--garis) solid var(--tinta);
  display:flex;flex-direction:column;padding:18px 18px 0;min-height:0;overflow:hidden;
}
.gelembung{
  position:relative;background:var(--kertas);border:var(--garis) solid var(--tinta);
  border-radius:22px;padding:14px 16px 12px;box-shadow:var(--bayang-kecil);
  display:flex;flex-direction:column;gap:8px;flex:0 0 auto;min-height:0;max-height:58%;
}
.gelembung-teks{font-weight:700;font-size:20px;line-height:1.35;overflow-y:auto;min-height:0}
.gelembung-bawah{display:flex;justify-content:flex-end}
.dengar{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px;
  background:var(--kuning);border:3px solid var(--tinta);cursor:pointer;font-weight:800;font-size:16px;
}
.dengar svg{width:22px;height:22px}
.ekor{width:34px;height:22px;margin-left:46px;margin-top:-4px;flex:0 0 auto}
.bina-wadah{flex:1 1 0;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:6px}
.bina-pose{height:100%;max-height:430px;max-width:92%;width:auto;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:melayang 3.6s ease-in-out infinite}
.bina-pose.ganti{animation:muncul var(--sedang) ease-out, melayang 3.6s ease-in-out var(--sedang) infinite}
.bina-kepala{display:none}
.lambai{position:relative;aspect-ratio:329/584;height:100%;width:auto;max-width:100%}
.lambai img{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.lambai .lengan{transform-origin:26.75% 51.37%;animation:lambai 3.2s ease-in-out infinite}
@keyframes lambai{
  0%{transform:rotate(0)} 7%{transform:rotate(12deg)} 15%{transform:rotate(-8deg)}
  23%{transform:rotate(12deg)} 31%{transform:rotate(-8deg)} 39%{transform:rotate(10deg)}
  48%,100%{transform:rotate(0)}
}
.bina-wadah .lambai{height:100%;max-height:430px;animation:melayang 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes melayang{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes muncul{from{transform:scale(.94) translateY(8px)}to{transform:none}}
.kendali{
  grid-area:kendali;background:var(--kuning);border-right:var(--garis) solid var(--tinta);
  padding:12px 18px 18px;
}
.kendali-isi{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:190px;margin:0 auto}
.ikon-btn{
  width:56px;height:56px;display:grid;place-items:center;background:var(--kertas);
  border:var(--garis) solid var(--tinta);box-shadow:var(--bayang-kecil);cursor:pointer;padding:0;
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.ikon-btn svg{width:28px;height:28px}
.ikon-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--tinta)}
.ikon-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--tinta)}
.ikon-btn[aria-pressed="false"]{background:var(--tinta);color:var(--kertas)}
#panggung{grid-area:panggung;overflow-y:auto;overflow-x:hidden;padding:clamp(16px,2.4vw,34px);position:relative;min-width:0;container:panggung / inline-size;
  background-color:var(--langit);background-image:radial-gradient(circle,var(--langit-titik) 1.7px,transparent 2.1px);background-size:24px 24px;background-attachment:local}
.judul-besar:focus,.judul-layar:focus{outline:none}
.layar{max-width:1440px;margin:0 auto;position:relative}

/* ---------- tombol ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-weight:800;font-size:20px;line-height:1.1;min-height:56px;padding:12px 22px;
  background:var(--kertas);color:var(--tinta);border:var(--garis) solid var(--tinta);
  box-shadow:var(--bayang-kecil);border-radius:0;cursor:pointer;text-decoration:none;
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.btn svg{width:24px;height:24px;flex:0 0 auto}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--tinta)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--tinta)}
.btn-utama{background:var(--tinta);color:var(--kertas);box-shadow:6px 6px 0 var(--kuning),6px 6px 0 2px var(--tinta)}
.btn-utama:hover{box-shadow:8px 8px 0 var(--kuning),8px 8px 0 2px var(--tinta)}
.btn-besar{font-size:clamp(20px,2.2vw,26px);min-height:64px;padding:14px 28px}
.btn-kecil{min-height:48px;font-size:17px;padding:8px 14px}
.tautan{
  background:none;border:0;padding:10px 4px;min-height:44px;cursor:pointer;
  font-weight:800;font-size:18px;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;
}
.tautan:hover{text-decoration-color:var(--kuning)}

/* ---------- HUD tiap layar ---------- */
.hud{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;margin-bottom:18px}
.judul-layar{font-size:clamp(28px,3.6vw,46px);flex:1 1 260px;outline:none}
.hitung{
  font-family:var(--angka);font-weight:700;font-size:22px;letter-spacing:-.02em;
  background:var(--tinta);color:var(--kertas);padding:6px 14px;min-width:84px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.hitung:empty{display:none}

/* ---------- beranda ---------- */
.beranda{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px 40px;align-items:center}
.beranda-judul{grid-column:1/-1;display:flex;flex-direction:column;gap:12px}
.beranda-teks{display:flex;flex-direction:column;gap:18px;min-width:0}
.logo-baris{display:flex;gap:12px;align-items:center}
.logo-baris img{height:46px;width:auto}
.judul-besar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 0;font-size:clamp(32px,3.95vw,66px);line-height:.95}
.judul-besar span{display:inline-block;padding:6px 14px 10px;border:var(--garis) solid var(--tinta);max-width:100%}
.judul-besar .j1{background:var(--kuning);transform:rotate(-2deg);box-shadow:var(--bayang)}
.judul-besar .j2{background:var(--tinta);color:var(--kertas);margin-left:clamp(10px,1.6vw,22px);margin-top:clamp(14px,1.8vw,26px)}
.identitas{font-weight:700;font-size:19px}
.cerita{font-size:20px;line-height:1.45;max-width:34ch}
.aksi{display:flex;align-items:center;gap:16px 22px;flex-wrap:wrap}
.kemajuan{font-family:var(--angka);font-weight:700;font-size:18px}
.beranda-rumah{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.bingkai{background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:8px 8px 0 var(--tinta);padding:10px}
.beranda-rumah figcaption{font-weight:700;font-size:18px}
.ruang-guru{
  grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:2px 18px;
  border-top:var(--garis) solid var(--tinta);padding-top:12px;margin-top:4px;
}
.ruang-guru > span{font-weight:800;font-size:18px;margin-right:2px}
.ruang-guru .tautan{font-size:17px}

/* ---------- rumah dan lapisan warna ---------- */
.rumah{position:relative;line-height:0;user-select:none;-webkit-user-select:none}
.rumah > .rumah-dasar{width:100%;height:auto}
.lapis{position:absolute;overflow:hidden;pointer-events:none;clip-path:circle(0% at 50% 50%);transition:clip-path var(--masuk) cubic-bezier(.2,.8,.2,1)}
.lapis.tampil{clip-path:circle(80% at 50% 50%)}
.lapis img{position:absolute;max-width:none;height:auto}
.zona{
  position:absolute;background:transparent;border:3px solid transparent;cursor:pointer;padding:0;
  transition:background var(--mikro),border-color var(--mikro);
}
.zona:hover,.zona:focus-visible{background:rgba(242,183,5,.32);border:4px dashed var(--tinta);outline:none}
.cap{
  position:absolute;right:5px;top:5px;width:28px;height:28px;display:grid;place-items:center;
  background:var(--tinta);color:var(--kuning);border-radius:50%;transform:scale(0);transition:transform var(--sedang);
}
.cap svg{width:18px;height:18px}
.sudah .cap{transform:scale(1)}
.zona.benar{background:rgba(242,183,5,.55);border:4px solid var(--tinta)}
.goyang{animation:goyang .42s}
@keyframes goyang{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.papan-rumah{background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);padding:8px}
.rumah-gulir{overflow-x:auto;overflow-y:hidden}
.rumah-gulir .rumah{max-width:min(100%,calc((100svh - var(--kurang,330px)) * 1.697));margin:0 auto}
.papan-rumah.jelajah{--kurang:250px}
.papan-rumah.tebak{--kurang:370px}
.geser-tanda{display:none;font-size:16px;font-weight:700;margin-top:8px}

/* ---------- kartu petunjuk ---------- */
.kartu-kata{
  background:var(--kuning);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);
  padding:14px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:4px;
}
.kartu-kata .siapa{font-weight:700;font-size:18px}
.kartu-kata .kata{font-weight:800;font-size:clamp(22px,2.4vw,30px);line-height:1.2}
.bawah-aksi{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* ---------- peta misi ---------- */
.peta{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 40px;padding:6px 6px 14px}
.peta-jalur{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stasiun{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left;
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);
  padding:12px 14px 14px;cursor:pointer;min-height:56px;
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.stasiun:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--tinta)}
.stasiun:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--tinta)}
.stasiun.selesai{background:var(--kuning-tipis)}
.stasiun-atas{display:flex;justify-content:space-between;align-items:center;gap:8px}
.no{
  font-family:var(--angka);font-weight:700;font-size:24px;width:44px;height:44px;display:grid;place-items:center;
  background:var(--kuning);border:3px solid var(--tinta);
}
.stasiun.selesai .no{background:var(--tinta);color:var(--kuning)}
.stasiun-gambar{height:clamp(84px,14svh,128px);display:flex;align-items:center;justify-content:center}
.stasiun-gambar img{max-height:100%;width:auto}
.stasiun-gambar svg{height:72%;width:auto;max-width:100%}
.stasiun-nama{font-weight:800;font-size:22px;line-height:1.1}
.stasiun-ket{font-size:16px;font-weight:700}
.tag-berikut{
  position:absolute;top:-16px;right:-10px;background:var(--tinta);color:var(--kertas);
  font-weight:800;font-size:16px;padding:4px 10px;transform:rotate(4deg);border:3px solid var(--tinta);
}
.bintang{display:inline-flex;gap:2px}
.bintang svg{width:24px;height:24px}
.hantu-angka{display:none}

/* ---------- butir seret ---------- */
.bisa-seret{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bisa-seret.terpilih{background:var(--kuning) !important;transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--tinta)}
.bisa-seret.sedang-diseret{opacity:.25}
.hantu{position:fixed;z-index:50;pointer-events:none;margin:0;opacity:.95;box-shadow:10px 10px 0 var(--tinta) !important}
.sasaran-aktif{outline:5px solid var(--tinta) !important;outline-offset:2px;background:var(--kuning-tipis) !important}

/* misi 2 */
.kosong{
  position:absolute;display:grid;place-items:center;text-align:center;padding:4px;cursor:pointer;
  background:var(--kertas);border:3px dashed var(--tinta);
  font-weight:800;font-size:clamp(12px,1.25vw,18px);line-height:1.1;color:var(--tinta);
  transition:opacity var(--sedang);
}
.kosong:hover{background:var(--kuning-tipis)}
.kosong.terisi{opacity:0;pointer-events:none}
.baki{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:18px}
.butir{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang-kecil);min-height:56px;
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.butir img{width:100%;max-width:96px;height:auto}
.butir span{font-weight:800;font-size:17px;line-height:1.1;text-align:center}
.butir.habis{visibility:hidden}
.baki-tugas .butir.habis{display:none}
.baki-kosong{grid-column:1/-1;border:var(--garis) dashed var(--tinta);padding:14px 16px;font-weight:700;font-size:18px}

/* misi 3 */
.kisi-rumah{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kartu-rumah{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;cursor:pointer;
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.kartu-rumah:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--tinta)}
.kartu-rumah img{width:100%;height:auto;max-height:clamp(110px,30svh,260px);object-fit:contain;transition:filter var(--masuk)}
.kartu-rumah .pemilik{min-height:30px;font-weight:800;font-size:18px}
.kartu-rumah.dapat{background:var(--kuning-tipis);cursor:default}
.kartu-rumah.dapat img{filter:none}
.kartu-rumah.dapat .pemilik{background:var(--tinta);color:var(--kertas);padding:2px 10px}

/* misi 4 */
.baki-tugas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.keluarga{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.anggota{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;min-height:250px;cursor:pointer;
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);
}
.anggota > img{height:clamp(96px,20svh,180px);width:auto}
.anggota .nama-orang{font-weight:800;font-size:22px}
.jumlah{font-family:var(--angka);font-weight:700;font-size:16px}
.chips{display:flex;flex-direction:column;gap:6px;width:100%}
.chip{
  display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:44px;
  background:var(--kuning);border:3px solid var(--tinta);padding:4px 8px;cursor:pointer;
  font-weight:800;font-size:15px;line-height:1.1;text-align:left;
}
.chip svg{width:18px;height:18px;flex:0 0 auto}
.status{margin-top:18px;border:var(--garis) solid var(--tinta);padding:12px 16px;font-weight:700;font-size:19px;background:var(--kertas)}
.status.oke{background:var(--kuning)}

/* misi 5 */
.meja-pilah{display:grid;grid-template-columns:1fr minmax(220px,1.1fr) 1fr;gap:22px;align-items:stretch}
.keranjang{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:16px 12px;cursor:pointer;
  border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);min-height:clamp(280px,52svh,440px);text-align:center;
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.keranjang:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--tinta)}
.keranjang.jaga{background:var(--kuning)}
.keranjang.rusak{background:var(--tinta);color:var(--kertas)}
.keranjang .lambang{width:64px;height:64px;display:grid;place-items:center;border:var(--garis) solid currentColor;border-radius:50%}
.keranjang .lambang svg{width:38px;height:38px}
.keranjang .label{font-weight:800;font-size:24px;line-height:1.05}
.isi-keranjang{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.isi-keranjang img{width:46px;height:46px;object-fit:contain;background:var(--kertas);border:2px solid var(--tinta)}
.tumpuk{position:relative;display:flex;align-items:center;justify-content:center}
.kartu-pilah{
  width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);
}
.kartu-pilah img{width:100%;max-width:clamp(180px,34svh,280px);height:auto}
.kartu-pilah span{font-weight:800;font-size:21px;text-align:center;line-height:1.15}
.kartu-pilah.terbang{transition:transform var(--sedang) ease-in,opacity var(--sedang) ease-in;opacity:0}

/* ujian */
.kartu-soal{
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);padding:18px;
}
.kartu-soal .tanya{font-weight:800;font-size:clamp(24px,2.8vw,34px);line-height:1.15;margin-bottom:16px}
.pilihan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.opsi{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;cursor:pointer;min-height:120px;
  background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:var(--bayang-kecil);
  transition:transform var(--mikro),box-shadow var(--mikro);
}
.opsi:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--tinta)}
.opsi img{height:clamp(96px,26svh,220px);width:auto;max-width:100%;object-fit:contain}
.opsi .rombongan{display:flex;align-items:flex-end;gap:2px;height:clamp(96px,26svh,220px)}
.opsi .rombongan img{height:100%}
.opsi .rombongan img.anak{height:76%}
.opsi span{font-weight:800;font-size:19px;text-align:center;line-height:1.15}
.opsi.benar{background:var(--kuning)}
.opsi.salah{background:var(--tinta);color:var(--kertas)}
.opsi .tanda{display:none;width:40px;height:40px;border-radius:50%;place-items:center;border:3px solid currentColor}
.opsi.benar .tanda,.opsi.salah .tanda{display:grid}
.opsi .tanda svg{width:26px;height:26px}
.pilihan.kunci .opsi{pointer-events:none}
.pilihan.kunci .opsi:not(.benar):not(.salah){opacity:.45}

/* sertifikat */
.sertifikat-wadah{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.sertifikat-gambar{border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);background:var(--kertas)}
.sertifikat-gambar img{width:100%}
.form-nama{display:flex;flex-direction:column;gap:8px}
.form-nama label{font-weight:800;font-size:19px}
.isian{
  font:700 22px var(--huruf);padding:12px 14px;min-height:56px;border:var(--garis) solid var(--tinta);
  background:var(--kertas);color:var(--tinta);width:100%;border-radius:0;
}
.isian:focus{outline:4px dashed var(--tinta);outline-offset:3px;background:var(--kuning-tipis)}
.catatan{font-size:17px;font-weight:600;line-height:1.4}

/* ---------- halaman guru ---------- */
.blok-kisi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.blok{background:var(--kertas);border:var(--garis) solid var(--tinta);padding:18px 20px;position:relative;overflow:hidden}
.blok.kuning{background:var(--kuning)}
.blok.lebar{grid-column:1/-1}
.blok h3{font-size:24px;margin-bottom:10px;position:relative}
.blok p,.blok li{font-size:18px;line-height:1.55;position:relative}
.blok p + p{margin-top:10px}
.blok ul,.blok ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;position:relative}
.kutip{border-left:8px solid var(--tinta);padding:4px 0 4px 16px;font-weight:700;font-size:19px;line-height:1.5}
.kecil{font-size:16px !important;font-weight:600}
.tabel-tp{width:100%;border-collapse:collapse;font-size:17px;position:relative}
.tabel-tp th,.tabel-tp td{border:3px solid var(--tinta);padding:8px 10px;text-align:left;vertical-align:top}
.tabel-tp th{background:var(--tinta);color:var(--kertas);font-weight:800}
.legenda{display:grid;grid-template-columns:56px 1fr;gap:12px 14px;align-items:center}
.legenda .ikon-btn{box-shadow:none;pointer-events:none}
.rujukan{padding-left:30px;text-indent:-30px}
.profil{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.profil-foto{width:clamp(130px,18vw,190px);aspect-ratio:1;object-fit:cover;border:var(--garis) solid var(--tinta);box-shadow:var(--bayang);background:var(--kuning)}
.profil-isi{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:6px}
.profil-isi h3{font-size:clamp(26px,3vw,36px)}
.data{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:18px;margin-top:8px}
.data dt{font-weight:800}
.data dd{margin:0}
.angka-hantu{
  position:absolute;right:10px;top:-24px;font-family:var(--angka);font-weight:700;font-size:150px;line-height:1;
  color:transparent;-webkit-text-stroke:3px var(--kuning);pointer-events:none;will-change:transform;
}
.blok.kuning .angka-hantu{-webkit-text-stroke-color:var(--kertas)}
.konfirmasi{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- modal misi selesai ---------- */
.tirai{position:fixed;inset:0;z-index:40;background:rgba(34,24,15,.78);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{
  width:min(640px,100%);background:var(--kertas);border:var(--garis) solid var(--tinta);box-shadow:10px 10px 0 var(--kuning);
  padding:22px 24px;display:flex;flex-direction:column;gap:14px;
}
.modal h2{font-size:clamp(32px,4vw,48px)}
.modal .bintang svg{width:56px;height:56px}
.modal .bintang svg{animation:bintang-masuk .5s cubic-bezier(.3,1.6,.5,1) both}
.modal .bintang svg:nth-child(2){animation-delay:.15s}
.modal .bintang svg:nth-child(3){animation-delay:.3s}
@keyframes bintang-masuk{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.modal .pesan{font-weight:700;font-size:20px}
.modal .bingkai{box-shadow:none;padding:6px;max-width:440px}

/* ---------- layar sempit dan pendek ---------- */
.peta .p1{grid-area:1/1}.peta .p2{grid-area:1/2}.peta .p3{grid-area:1/3}
.peta .p4{grid-area:2/3}.peta .p5{grid-area:2/2}.peta .p6{grid-area:2/1}
@media (max-height:760px){
  .gelembung-teks{font-size:18px}
  .stasiun-gambar{height:clamp(64px,12svh,100px)}
  .anggota{min-height:200px}
  .keranjang{min-height:240px}
}
@container panggung (max-width:860px){
  .peta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .peta .p1{grid-area:1/1}.peta .p2{grid-area:1/2}.peta .p3{grid-area:2/2}
  .peta .p4{grid-area:2/1}.peta .p5{grid-area:3/1}.peta .p6{grid-area:3/2}
}
@container panggung (max-width:760px){
  .beranda{grid-template-columns:1fr}
  .butir span{font-size:15px}
  .baki,.baki-tugas{gap:10px}
}
@container panggung (max-width:640px){
  .sertifikat-wadah{grid-template-columns:1fr}
  .kisi-rumah{grid-template-columns:repeat(2,minmax(0,1fr))}
  .baki,.baki-tugas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .blok-kisi{grid-template-columns:1fr}
  .meja-pilah{grid-template-columns:1fr 1fr;grid-template-areas:"kartu kartu" "jaga rusak"}
  .meja-pilah .tumpuk{grid-area:kartu}
  .meja-pilah .jaga{grid-area:jaga}
  .meja-pilah .rusak{grid-area:rusak}
  .keranjang{min-height:170px}
  .kartu-pilah img{max-width:170px}
  .keluarga{grid-template-columns:repeat(2,minmax(0,1fr))}
  .angka-hantu{font-size:110px}
  .tabel-wadah{overflow-x:auto}
}
@container panggung (max-width:560px){
  .judul-besar .j2{margin-left:8px}
  .beranda .judul-besar{font-size:clamp(28px,8.6vw,40px)}
  .hud{display:grid;grid-template-columns:1fr auto;gap:10px 12px}
  .hud .btn-kecil{justify-self:start}
  .hud .judul-layar{grid-column:1/-1;grid-row:2}
  .hud .hitung{grid-column:2;grid-row:1}
  .peta{grid-template-columns:1fr;gap:22px;padding-left:22px}
  .peta .stasiun{grid-area:auto;overflow:hidden;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"atas atas" "gambar nama" "gambar ket";column-gap:14px;align-items:center}
  .peta-jalur{display:none}
  .peta::before{content:"";position:absolute;left:4px;top:20px;bottom:20px;border-left:6px dashed var(--tinta)}
  .stasiun-atas{grid-area:atas;position:relative;z-index:1}
  .stasiun-gambar{grid-area:gambar;height:84px;width:96px;position:relative;z-index:1}
  .stasiun-nama{grid-area:nama;position:relative;z-index:1}
  .stasiun-ket{grid-area:ket;position:relative;z-index:1}
  .tag-berikut{top:6px;right:auto;left:62px;transform:rotate(-3deg);z-index:2}
  .peta .stasiun{padding-right:58px}
  #mainan > .baki{position:sticky;bottom:0;z-index:4;background:var(--langit);padding:10px 0 6px;margin-top:10px;border-top:3px dashed var(--tinta)}
  #mainan > .baki-tugas{position:sticky;top:0;z-index:4;background:var(--langit);padding:6px 0 10px;border-bottom:3px dashed var(--tinta)}
  #mainan > .baki-tugas .baki-kosong{font-size:16px;padding:10px 12px}
  .baki .butir,.baki-tugas .butir{padding:6px 4px;gap:4px}
  .baki .butir img,.baki-tugas .butir img{max-width:54px}
  .baki .butir span,.baki-tugas .butir span{font-size:14px}
  .anggota{min-height:200px}
  .hantu-angka{display:block;position:absolute;right:8px;bottom:-14px;font-family:var(--angka);font-weight:700;font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--kuning);pointer-events:none;z-index:0;will-change:transform}
  .rumah-gulir .rumah{min-width:600px;max-width:none}
  .geser-tanda{display:block}
  .pilihan{grid-template-columns:1fr}
  .opsi{flex-direction:row;justify-content:flex-start;min-height:88px}
  .opsi img,.opsi .rombongan{height:70px}
}
@media (max-width:760px){

  .pemandu{padding:8px 10px}

  .bina-kepala{width:52px !important;height:52px !important}

  .gelembung-teks.panjang{-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
  .gelembung-teks.panjang.ujung{-webkit-mask-image:none;mask-image:none}
  .dengar{min-height:48px;width:48px;padding:0;justify-content:center;flex:0 0 auto}
  .dengar span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .kendali{border-right:0;border-top:var(--garis) solid var(--tinta);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .kendali-isi{flex-wrap:nowrap;justify-content:space-around;gap:6px;max-width:none}
  .ikon-btn{box-shadow:none;width:54px;height:54px}

@media (max-height:520px) and (min-width:761px){

  .bina-pose,.ekor,.bina-wadah .lambai{display:none !important}
  .bina-kepala{display:block;width:52px;height:52px;border-radius:50%;border:3px solid var(--tinta);background:var(--kertas);object-fit:cover}
  .gelembung{max-height:none;flex:1 1 auto;min-height:0;padding:8px 10px;box-shadow:none;margin-bottom:8px}
  .gelembung-teks{font-size:16px;flex:1 1 auto;min-height:0}
  .gelembung-teks.panjang{-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
  .gelembung-teks.panjang.ujung{-webkit-mask-image:none;mask-image:none}
  .dengar{min-height:44px}
  .kendali{padding:8px 10px 10px}
  .kendali-isi{max-width:none;gap:6px}
  .ikon-btn{width:48px;height:48px;box-shadow:none}
}

}

/* ---------- seret dan ketuk ---------- */
function pasangSeret(o){
  var wadah = o.wadah, terpilih = null, seret = null, abaikanKlik = false, sorot = null;
  function pilih(el){
    if (terpilih) { terpilih.classList.remove("terpilih"); terpilih.setAttribute("aria-pressed", "false"); }
    terpilih = el;
    if (el) { el.classList.add("terpilih"); el.setAttribute("aria-pressed", "true"); if (o.saatPilih) o.saatPilih(el); }
  }
  function cari(x, y){
    var els = document.elementsFromPoint(x, y);
    for (var i = 0; i < els.length; i++) { var s = els[i].closest && els[i].closest(o.sasaran); if (s && wadah.contains(s)) return s; }
    return null;
  }
  /* Saat diseret ke tepi, rumah (geser kiri-kanan di ponsel) dan layar ikut bergulir. */
  function gulirTepi(){
    if (!seret || !seret.aktif) return;
    var x = seret.px, y = seret.py, dx = x - seret.x0, dy = y - seret.y0, gerak = false;
    var g = wadah.querySelector(".rumah-gulir");
    if (g && g.scrollWidth > g.clientWidth + 2) {
      var rg = g.getBoundingClientRect(), tepi = Math.min(60, rg.width / 5);
      if (y >= rg.top - 40 && y <= rg.bottom + 40) {
        if (x < rg.left + tepi && dx < -10 && g.scrollLeft > 0) { g.scrollLeft -= Math.ceil((rg.left + tepi - x) / 5) + 2; gerak = true; }
        else if (x > rg.right - tepi && dx > 10 && g.scrollLeft < g.scrollWidth - g.clientWidth - 1) { g.scrollLeft += Math.ceil((x - rg.right + tepi) / 5) + 2; gerak = true; }
      }
    }
    var p = document.getElementById("panggung");
    if (p && p.scrollHeight > p.clientHeight + 2) {
      var rp = p.getBoundingClientRect(), tv = 64;
      if (y < rp.top + tv && dy < -10 && p.scrollTop > 0) { p.scrollTop -= Math.ceil((rp.top + tv - y) / 5) + 2; gerak = true; }
      else if (y > rp.bottom - tv && dy > 10 && p.scrollTop < p.scrollHeight - p.clientHeight - 1) { p.scrollTop += Math.ceil((y - rp.bottom + tv) / 5) + 2; gerak = true; }
    }
    if (gerak) aturSorot(cari(x, y));
    seret.raf = requestAnimationFrame(gulirTepi);
  }
  function aturSorot(s){ if (sorot === s) return; if (sorot) sorot.classList.remove("sasaran-aktif"); sorot = s; if (s) s.classList.add("sasaran-aktif"); }
  wadah.addEventListener("click", function(e){
    if (abaikanKlik) { abaikanKlik = false; return; }
    var it = e.target.closest(o.butir);
    if (it && wadah.contains(it)) { if (!it.disabled) pilih(terpilih === it ? null : it); return; }
    var sa = e.target.closest(o.sasaran);
    if (sa && wadah.contains(sa)) {
      if (terpilih) { var t = terpilih; pilih(null); o.saatJatuh(t, sa, null); }
      else if (o.saatKetukSasaran) o.saatKetukSasaran(sa);
    }
  });
  wadah.addEventListener("dragstart", function(e){ e.preventDefault(); });
  wadah.addEventListener("pointerdown", function(e){
    var it = e.target.closest(o.butir);
    if (!it || !wadah.contains(it) || it.disabled || e.button > 0) return;
    seret = { it:it, x0:e.clientX, y0:e.clientY, r:it.getBoundingClientRect(), aktif:false, hantu:null };
    try { it.setPointerCapture(e.pointerId); } catch (er) {}
  });
  wadah.addEventListener("pointermove", function(e){
    if (!seret) return;
    var dx = e.clientX - seret.x0, dy = e.clientY - seret.y0;
    if (!seret.aktif) {
      if (Math.abs(dx) + Math.abs(dy) < 9) return;
      seret.aktif = true;
      pilih(null);
      var h = seret.it.cloneNode(true);
      h.classList.add("hantu"); h.removeAttribute("id"); h.setAttribute("aria-hidden", "true");
      h.style.width = seret.r.width + "px"; h.style.height = seret.r.height + "px";
      h.style.left = seret.r.left + "px"; h.style.top = seret.r.top + "px";
      document.body.appendChild(h); seret.hantu = h;
      seret.it.classList.add("sedang-diseret");
      seret.px = e.clientX; seret.py = e.clientY;
      seret.raf = requestAnimationFrame(gulirTepi);
    }
    seret.px = e.clientX; seret.py = e.clientY;
    seret.hantu.style.transform = "translate(" + dx + "px," + dy + "px) rotate(-3deg)";
    aturSorot(cari(e.clientX, e.clientY));
  });
  function lepas(e, batal){
    if (!seret) return;
    var s = seret; seret = null;
    if (s.raf) cancelAnimationFrame(s.raf);
    if (!s.aktif) return;
    abaikanKlik = true; setTimeout(function(){ abaikanKlik = false; }, 0);
    aturSorot(null);
    var sa = batal ? null : cari(e.clientX, e.clientY);
    var ok = sa ? o.saatJatuh(s.it, sa, s.hantu) : false;
    s.it.classList.remove("sedang-diseret");
    if (ok) { s.hantu.remove(); }
    else {
      s.hantu.style.transition = "transform 240ms ease-out";
      s.hantu.style.transform = "translate(0,0)";
      setTimeout(function(){ s.hantu.remove(); }, 260);
    }
  }
  wadah.addEventListener("pointerup", function(e){ lepas(e, false); });
  wadah.addEventListener("pointercancel", function(e){ lepas(e, true); });
  bersih.push(function(){ if (seret && seret.hantu) seret.hantu.remove(); seret = null; });
  return { pilih:pilih };
}

var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function muatGambar(src){ return new Promise(function(ok){ var im = new Image(); im.onload = function(){ ok(im); }; im.onerror = function(){ ok(null); }; im.src = src; }); }
function bungkusTeks(c, teks, x, y, lebar, tinggiBaris){

    c.font = "700 30px " + M; c.fillText("SERTIFIKAT", x, 130);

    var nama = S.nama || "Sahabat Bina";
    c.fillStyle = "#F2B705"; c.fillRect(x - 6, 360, 960, 132);

/* ---------- layar pembuka ---------- */
var pembuka = $("#pembuka"), aplikasi = $("#aplikasi");
/* Kalau animasi Bina gagal dimuat (berkas belum terunggah, atau diblokir hosting),
   pakai gambar Bina biasa yang lengannya digerakkan CSS, supaya tidak tampil gambar rusak. */
var binaGerak = $("#lambaiPembuka .gerak");
function binaCadangan(){
  $("#lambaiPembuka").innerHTML = '<img src="' + A + 'bina-lambai-badan.webp" alt=""><img class="lengan" src="' + A + 'bina-lambai-lengan.webp" alt="">';
}
if (binaGerak) {
  if (binaGerak.complete && !binaGerak.naturalWidth) binaCadangan();
  else binaGerak.addEventListener("error", binaCadangan);
}
function selesaiPembuka(){
  if (pembuka && pembuka.parentNode) pembuka.remove();
  aplikasi.removeAttribute("inert");
  binaLambai.style.visibility = "";
  try { panggung.focus({ preventScroll:true }); } catch (e) {}
  bunyikan(terakhirKlip, terakhir);
}
function tutupPembuka(){
  tandaiInteraksi();
  efek("pop");
  if (GERAK_KURANG) { selesaiPembuka(); return; }
  var asal = $("#lambaiPembuka"), tujuan = binaLambai;
  var ra = asal.getBoundingClientRect(), rt = tujuan.getBoundingClientRect();
  var bisaTerbang = !binaLambai.hidden && rt.width > 20 && getComputedStyle(tujuan).display !== "none";
  if (!bisaTerbang) {
    pembuka.classList.add("geser");
    setTimeout(selesaiPembuka, 470);
    return;
  }
  binaLambai.style.visibility = "hidden";
  pembuka.classList.remove("pb-masuk");
  pembuka.classList.add("keluar");
  var sx = rt.width / ra.width, sy = rt.height / ra.height;
  asal.style.animation = "none";
  asal.style.transformOrigin = "0 0";
  asal.style.transition = "transform 560ms cubic-bezier(.5,0,.2,1)";
  requestAnimationFrame(function(){
    asal.style.transform = "translate(" + (rt.left - ra.left) + "px," + (rt.top - ra.top) + "px) scale(" + sx + "," + sy + ")";
  });
  /* Pose animasi pembuka dan gambar Bina di panel tidak persis sama, jadi saat mendarat
     keduanya silang-pudar sebentar, bukan berganti mendadak. */
  var sudah = false;
  function akhir(){
    if (sudah) return; sudah = true;
    binaLambai.style.visibility = "";
    pembuka.classList.add("pudar");
    setTimeout(selesaiPembuka, 200);
  }
  asal.addEventListener("transitionend", akhir);
  setTimeout(akhir, 700);
}
$("#tblStart").addEventListener("click", tutupPembuka);

/* ---------- mulai ---------- */
var awal = (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.layar) || "beranda";
if (!LAYAR[awal] || awal === "sertifikat") awal = "beranda";
pergi(awal);
if (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.layar) { selesaiPembuka(); }

})();
